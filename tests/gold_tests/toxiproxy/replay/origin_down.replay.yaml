#
# Toxiproxy origin-leg down-marking scenario (after several retries). The origin
# is a hostname resolved via a test DNS server, so ATS tracks it in HostDB. A
# downstream `timeout` toxic holds the response forever, so every connection
# attempt hits ATS's no-activity timeout. With connect.down.policy=3 each
# timed-out attempt counts as a connection failure, and
# connect_attempts_max_retries=2 makes ATS retry the impaired origin twice (3
# attempts total) within the first request. Those 3 failures reach the down
# threshold (max_retries + 1 = 3), so the first request marks the origin address
# down and returns 504. The second request is then refused at DNS-resolution time
# (all addresses down) and ATS returns 500 (connect#all_down).
#

meta:
  version: "1.0"

# Applied by Test.ToxiproxyReplayTest.
autest:
  # Resolve any hostname (e.g. down-origin.test) to 127.0.0.1 so ATS keeps a
  # HostDB record it can mark down.
  dns:
    name: dns

  # The 'origin' proxy forwards to the Proxy Verifier server; a downstream
  # `timeout` toxic (timeout=0: hold, never deliver) blocks the response.
  toxiproxy:
    name: toxiproxy
    proxies:
      - name: origin
        upstream: "127.0.0.1:{SERVER_HTTP_PORT}"
        toxics:
          - type: timeout
            attributes:
              timeout: 0

  # Remap targets a hostname (resolved via DNS to 127.0.0.1) on the Toxiproxy
  # listen port. connect.down.policy=3 counts each timed-out attempt as a
  # connection failure; connect_attempts_max_retries=2 retries the origin per
  # request (3 attempts) and sets the down threshold to max_retries + 1 = 3
  # failures, reached within the first request; down_server.cache_time keeps it
  # down long enough for the next request.
  ats:
    name: ts
    records_config:
      proxy.config.http.cache.http: 0
      proxy.config.http.connect.down.policy: 3
      proxy.config.http.connect_attempts_timeout: 2
      proxy.config.http.connect_attempts_max_retries: 2
      proxy.config.http.connect_attempts_rr_retries: 0
      proxy.config.http.down_server.cache_time: 300
      proxy.config.http.transaction_no_activity_timeout_out: 2
    remap_config:
      - from: http://origin.ex
        to: http://down-origin.test:{TOXIPROXY_ORIGIN_PORT}

sessions:
- transactions:
  # Request 1: ATS retries the timing-out origin (3 attempts); the accumulated
  # failures reach the threshold, so this request marks the origin down and
  # returns 504.
  - all: { headers: { fields: [[ uuid, down1 ]]}}
    client-request: { method: GET, version: "1.1", scheme: http, url: /1, headers: { fields: [[ Host, origin.ex ]]}}
    server-response: { status: 200, reason: OK, headers: { fields: [[ Content-Length, 16 ]]}}
    proxy-response: { status: 504 }
  # Request 2: origin is now down; ATS refuses to attempt and returns 500.
  - all: { headers: { fields: [[ uuid, down2 ]]}}
    client-request: { method: GET, version: "1.1", scheme: http, url: /2, headers: { fields: [[ Host, origin.ex ]]}}
    server-response: { status: 200, reason: OK, headers: { fields: [[ Content-Length, 16 ]]}}
    proxy-response: { status: 500 }
