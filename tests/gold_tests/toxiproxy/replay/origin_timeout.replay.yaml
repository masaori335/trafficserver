#
# Toxiproxy origin-leg timeout down-marking scenario (immediate, no retries). The
# origin is a hostname resolved via a test DNS server, so ATS tracks it in
# HostDB. A downstream `timeout` toxic holds the response forever, so the request
# hits ATS's no-activity timeout (504). With connect.down.policy=3 that inactive
# timeout counts as a connection failure, and connect_attempts_max_retries=0
# makes a single failure enough to mark the origin down (threshold =
# max_retries + 1 = 1). The first request returns 504 and marks the origin down;
# the second request is refused at DNS-resolution time (all addresses down) and
# ATS returns 500 (connect#all_down). Contrast down.replay.yaml, which retries
# and needs the failures to accumulate before the origin is marked down.
#

meta:
  version: "1.0"

# Applied by Test.ToxiproxyReplayTest.
autest:
  # Resolve any hostname (e.g. timeout-origin.test) to 127.0.0.1 so ATS keeps a
  # HostDB record it can mark down.
  dns:
    name: dns

  # The 'origin' proxy forwards to the Proxy Verifier server; a downstream
  # `timeout` toxic (timeout=0: hold, never deliver) blocks the response.
  toxiproxy:
    name: toxiproxy
    proxies:
      - name: origin
        upstream: "127.0.0.1:{SERVER_HTTP_PORT}"
        toxics:
          - type: timeout
            attributes:
              timeout: 0

  # Remap targets a hostname (resolved via DNS to 127.0.0.1) on the Toxiproxy
  # listen port. connect.down.policy=3 counts the inactive timeout as a
  # connection failure; connect_attempts_max_retries=0 marks the address down
  # after a single failure; down_server.cache_time keeps it down long enough for
  # the next request.
  ats:
    name: ts
    records_config:
      proxy.config.http.cache.http: 0
      proxy.config.http.connect.down.policy: 3
      proxy.config.http.connect_attempts_timeout: 2
      proxy.config.http.connect_attempts_max_retries: 0
      proxy.config.http.connect_attempts_rr_retries: 0
      proxy.config.http.down_server.cache_time: 300
      proxy.config.http.transaction_no_activity_timeout_out: 2
    remap_config:
      - from: http://origin.ex
        to: http://timeout-origin.test:{TOXIPROXY_ORIGIN_PORT}

sessions:
- transactions:
  # Request 1: times out (504) and, with a single failure, marks the origin down.
  - all: { headers: { fields: [[ uuid, timeout1 ]]}}
    client-request: { method: GET, version: "1.1", scheme: http, url: /1, headers: { fields: [[ Host, origin.ex ]]}}
    server-response: { status: 200, reason: OK, headers: { fields: [[ Content-Length, 16 ]]}}
    proxy-response: { status: 504 }
  # Request 2: origin is now down; ATS refuses to attempt and returns 500.
  - all: { headers: { fields: [[ uuid, timeout2 ]]}}
    client-request: { method: GET, version: "1.1", scheme: http, url: /2, headers: { fields: [[ Host, origin.ex ]]}}
    server-response: { status: 200, reason: OK, headers: { fields: [[ Content-Length, 16 ]]}}
    proxy-response: { status: 500 }
