meta:
  version: "1.0"

urtest:
  description: 'prism.so runs a hand-written set-header IR through the Cripts-based interpreter'
  requires:
    ats_features: [TS_HAS_CRIPTS]
    plugins: [prism.so]

  dns:
    name: 'dns'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'

    copy_to_config_dir:
      - 'set_header.ir'

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'prism|cript'

    # prism.so refuses a relative .ir path, which traffic_server would read from its prefix.
    remap_config:
      - from: "http://set-header.test/"
        to: "http://backend.ex:{SERVER_HTTP_PORT}/"
        plugins:
          - {name: "prism.so", args: ["{CONFIG_DIR}/set_header.ir"]}

sessions:
- transactions:

  - client-request:
      method: "GET"
      version: "1.1"
      url: /no-origin-header
      headers:
        fields:
        - [ Host, set-header.test ]
        - [ uuid, no-origin-header ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, "0" ]

    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Foo, { value: [ bar ], as: equal } ]

  # The origin's two X-Foo lines are replaced by one: set, not add.
  - client-request:
      method: "GET"
      version: "1.1"
      url: /origin-has-two
      headers:
        fields:
        - [ Host, set-header.test ]
        - [ uuid, origin-has-two ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, "0" ]
        - [ X-Foo, old ]
        - [ X-Foo, old ]

    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Foo, { value: [ bar ], as: equal } ]
