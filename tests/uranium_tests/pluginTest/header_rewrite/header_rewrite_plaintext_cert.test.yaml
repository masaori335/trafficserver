meta:
  version: "1.0"

urtest:
  description: 'header_rewrite SERVER-CERT qualifiers on a plaintext connection'

  # The certificate qualifiers exist only when ATS is built with Cripts.
  requires:
    ats_features: [TS_HAS_CRIPTS]
    plugins: [header_rewrite.so]

  dns:
    name: 'dns'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'

    process_config:
      enable_cache: false

    copy_to_config_dir:
      - 'plaintext_cert.conf'

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'header_rewrite'

    plugin_config:
      - 'header_rewrite.so plaintext_cert.conf'

    remap_config:
      - from: "http://www.example.com/"
        to: "http://backend.ex:{SERVER_HTTP_PORT}/"

sessions:
- transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /plaintext/
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, plaintext-cert ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 0 ]

    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Plaintext-Response, { value: "served", as: equal } ]
        - [ X-Server-Cert-Subject, { as: absent } ]
