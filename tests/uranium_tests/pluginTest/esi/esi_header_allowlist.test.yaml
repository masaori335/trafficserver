urtest:
  description: "Verify ESI expands only explicitly allowed client request headers"
  requires:
    plugins: ["esi.so"]
  server:
    name: "esi-header-allowlist-origin"
  client:
    name: "esi-header-allowlist-client"
  ats:
    name: "esi-header-allowlist-ts"
    copy_to_config_dir:
      - "esi_header_allowlist.conf"
    plugin_config:
      - "esi.so --handler-filename esi_header_allowlist.conf"
    remap_config:
      - from: "http://www.example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

sessions:
  - transactions:
      - client-request:
          method: GET
          version: "1.1"
          url: /headers.php
          headers:
            fields:
              - [Host, www.example.com]
              - [uuid, esi-header-allowlist]
              # Lowercase on purpose: ESI's HTTP_HEADER{...} lookup is
              # case-sensitive on the document side (see
              # plugins/esi/lib/Variables.cc), and proxy-verifier / ATS may
              # normalize wire header names. A name that is already canonical
              # removes the ambiguity.
              - [x-esi-allowed, visible-value]
              # Authorization and Proxy-Authorization are well-known MIME
              # fields, so ATS reports them in their canonical case regardless
              # of the case on the wire. The document below must reference
              # that same canonical spelling or the lookup would miss even
              # without the allowlist.
              - [Authorization, "Bearer authorization-secret"]
              - [Proxy-Authorization, "Basic proxy-secret"]

        # Authorization is forwarded normally to the origin.
        proxy-request:
          headers:
            fields:
              - [Authorization, {value: "Bearer authorization-secret", as: equal}]

        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [X-Esi, "1"]
              - [Cache-Control, private]
              - [Content-Type, text/plain]
              - [Connection, close]
          content:
            encoding: plain
            data: "<esi:vars>allowed=$(HTTP_HEADER{x-esi-allowed}) auth=$(HTTP_HEADER{Authorization}) proxy-auth=$(HTTP_HEADER{Proxy-Authorization}) END</esi:vars>"

        proxy-response:
          status: 200
          content:
            encoding: plain
            # Only the allowlisted header expands. The trailing END sentinel
            # matters: without it a leak into the last variable would still
            # leave the expected text as a substring of the rendered body.
            # With it, either credential appearing after auth= or proxy-auth=
            # makes this content check fail.
            data: "allowed=visible-value auth= proxy-auth= END"
            verify: {as: contains}
