meta:
  version: "1.0"

# A single client session (one kept-alive client connection) carrying two
# transactions.  The first request asks the plugin to pin the outbound source
# port; the second request does not.  Because the origin closes each upstream
# connection, the second request forces a fresh upstream connect whose bound
# source port reveals whether the first request's override persisted.
sessions:
  - transactions:
      - client-request:
          method: "GET"
          version: "1.1"
          url: /first
          headers:
            fields:
              - [uuid, first-request]
              - [Host, example.com]
              - [X-Set-Outbound, "1"]
        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, 0]
              - [Connection, close]
        proxy-response:
          status: 200

      - client-request:
          # Give ATS time to finish tearing down the first upstream connection
          # before the second one is opened.  Whether the pinned source port is
          # reusable by then depends on which side performed the active close, so
          # do not count on either outcome: a leak can surface as the second
          # request binding the pinned port, or as a failed rebind that kills the
          # upstream connect.  The checker in test_outbound_addr_keepalive.py handles both shapes.
          delay: 200ms
          method: "GET"
          version: "1.1"
          url: /second
          headers:
            fields:
              - [uuid, second-request]
              - [Host, example.com]
        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, 0]
              - [Connection, close]
        proxy-response:
          status: 200
