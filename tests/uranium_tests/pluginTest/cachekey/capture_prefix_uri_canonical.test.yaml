#
# Under --canonical-prefix, --capture-prefix-uri captures come from the raw URI
# (getUri -> TSUrlStringGet), whose host bytes are not encoded. Appended raw, a
# Host carrying %2f would survive into the key and the cache, parsing the key as
# a URL, decodes %2f back to '/', colliding distinct hosts. The capture must be
# percent-encoded so %2f becomes %252f and the hosts stay distinct.
#

meta:
  version: '1.0'

urtest:
  requires: {plugins: [cachekey.so, xdebug.so]}
  description: 'capture-prefix-uri encodes host bytes under canonical-prefix'
  server:
    name: server
  client:
    name: client
  ats:
    name: ts
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: cachekey
    plugin_config:
      - 'xdebug.so --enable=x-cache-key'
    remap_config:
      - from: 'http://evil%2Fx.example.com/'
        to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
        plugins:
          - name: cachekey.so
            args:
              - '--uri-type=pristine'
              - '--canonical-prefix=true'
              - '--capture-prefix-uri=/^(https?:\/\/[^\/]+)\/.*$/$1/'
      - from: 'http://plain.example.com/'
        to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
        plugins:
          - name: cachekey.so
            args:
              - '--uri-type=pristine'
              - '--canonical-prefix=true'
              - '--capture-prefix-uri=/^(https?:\/\/[^\/]+)\/.*$/$1/'

sessions:
- transactions:
  - client-request:
      method: GET
      url: /y
      version: '1.1'
      headers:
        fields:
        - [Host, 'evil%2Fx.example.com']
        - [uuid, evil]
        - [X-Debug, x-cache-key]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 0]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Cache-Key, {value: 'http://evil%252Fx.example.com/y', as: equal}]

  - client-request:
      method: GET
      url: /x/y
      version: '1.1'
      headers:
        fields:
        - [Host, plain.example.com]
        - [uuid, plain]
        - [X-Debug, x-cache-key]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 0]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Cache-Key, {value: 'http://plain.example.com/x/y', as: equal}]
