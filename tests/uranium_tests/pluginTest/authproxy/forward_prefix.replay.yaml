meta:
  version: "1.0"

sessions:
- transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /protected
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, 1 ]
        - [ X-Auth-User, attacker ]
        - [ X-Auth-User, admin ]
        - [ X-Auth-Role, admin ]

    # Exactly one X-Auth-User, carrying the auth service's value, and no
    # X-Auth-Role since the auth service did not assert one.
    proxy-request:
      headers:
        fields:
        - [ X-Auth-User, { value: attacker, as: equal } ]
        - [ X-Auth-Role, { as: absent } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 0 ]

    proxy-response:
      status: 200
