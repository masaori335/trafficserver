meta:
  version: "1.0"

  txn_box:
    global:
    - when: ua-req
      do:
      - ua-req-query:
        - ua-req-query
        - query-filter:
          - match: name
            option:
              value:
                match: value
            pass:
          - drop:

  blocks:
  - base-req: &base-req
      version: "1.1"
      method: "GET"
  - base-rsp: &base-rsp
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, html/plaintext ]
        - [ Content-Length, 96 ]

sessions:
- protocol:
    stack: http
  transactions:
  - all: { headers: { fields: [[ uuid, local-extractor-comparison ]]}}
    client-request:
      <<: *base-req
      url: "/page.html?alpha=one&bravo=two"
      headers:
        fields:
        - [ Host, one.ex ]
    proxy-request:
      <<: *base-req
      url:
      - [ query, { value: "alpha=one&bravo=two", as: equal } ]
    server-response:
      <<: *base-rsp
    proxy-response:
      status: 200

urtest:
  description: Verify txn_box query filters expose the current pair to local extractors
  requires:
    plugins:
    - txn_box.so
  server:
    name: txn-box-query-filter-local-extractors-origin
  client:
    name: txn-box-query-filter-local-extractors-client
  ats:
    name: txn-box-query-filter-local-extractors-ts
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: txn_box
      proxy.config.http.cache.http: 0
    copy_to_config_dir:
    - query-filter-local-extractors.test.yaml
    remap_config:
    - map / http://127.0.0.1:{SERVER_HTTP_PORT}
    plugin_config:
    - txn_box.so
    - txn_box.so --key meta.txn_box.global {CONFIG_DIR}/query-filter-local-extractors.test.yaml
