# Target origin: serves the cacheable object for the warm up, then answers the
# revalidation of the stale copy with a 304 that forbids storing it.

meta:
  version: "1.0"

sessions:
- protocol:
    stack: http
  transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /target
      headers:
        fields:
        - [ Host, a.test ]
        - [ uuid, lookupnull-warm ]
    server-response:
      status: 200
      reason: "OK"
      headers:
        fields:
        - [ Last-Modified, "Mon, 01 Jan 2024 00:00:00 GMT" ]
        - [ Cache-Control, "max-age=1" ]
        - [ Content-Length, 3 ]

  - client-request:
      method: "GET"
      version: "1.1"
      url: /target
      headers:
        fields:
        - [ Host, a.test ]
        - [ uuid, lookupnull-probe ]
    server-response:
      status: 304
      reason: "Not Modified"
      headers:
        fields:
        - [ Cache-Control, "no-store" ]
        - [ Content-Length, 0 ]
