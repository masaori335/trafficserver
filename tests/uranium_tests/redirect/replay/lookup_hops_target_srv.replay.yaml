# Last hop of the two hop redirect chain. The warm up stores a long lived copy
# marked "warm"; every later fetch from this origin is marked differently, so a
# response tells whether it came from the cache or from here.

meta:
  version: "1.0"

sessions:
- protocol:
    stack: http
  transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /t2
      headers:
        fields:
        - [ uuid, lookup-hops-warm ]
    server-response:
      status: 200
      reason: "OK"
      headers:
        fields:
        - [ Cache-Control, "max-age=3600" ]
        - [ X-Src, warm ]
        - [ Content-Length, 3 ]

  - client-request:
      method: "${method}"
      version: "1.1"
      url: /t2
      headers:
        fields:
        - [ uuid, lookup-hops-probe ]
    server-response:
      status: 200
      reason: "OK"
      headers:
        fields:
        - [ X-Src, probe ]
        - [ Content-Length, 3 ]

  - client-request:
      method: "GET"
      version: "1.1"
      url: /t2
      headers:
        fields:
        - [ uuid, lookup-hops-after ]
    server-response:
      status: 200
      reason: "OK"
      headers:
        fields:
        - [ Cache-Control, "max-age=3600" ]
        - [ X-Src, after ]
        - [ Content-Length, 3 ]
