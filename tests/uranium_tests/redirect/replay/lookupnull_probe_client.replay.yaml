# Conditional GET to a dynamic looking URL. The query string makes the request
# non cache lookupable, so no cache lookup URL is established. The origin
# redirects to the warmed target, which is stale, so ATS revalidates.

meta:
  version: "1.0"

sessions:
- protocol:
    stack: http
  transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /entry?x=1
      headers:
        fields:
        - [ Host, a.test ]
        - [ If-Modified-Since, "Mon, 01 Jan 2024 00:00:00 GMT" ]
        - [ uuid, lookupnull-probe ]
    proxy-response:
      status: 304
