# First hop: a dynamic looking URL, so the request never establishes a cache
# lookup URL, redirected to the middle hop.

meta:
  version: "1.0"

sessions:
- protocol:
    stack: http
  transactions:
  - client-request:
      method: "${method}"
      version: "1.1"
      url: /entry?x=1
      headers:
        fields:
        - [ uuid, lookup-hops-probe ]
    server-response:
      status: 302
      reason: "Found"
      headers:
        fields:
        - [ Location, "http://a.test:${next_http_port}/m1" ]
        - [ Content-Length, 0 ]
