#
# Pipeline naming convention: https://quip-apple.com/SYBPApmmz4QH
#

schemaVersion: "2.0"

<<: &build_machine
  machine:
    baseImage: docker.apple.com/edge/trafficserver_build:20261001-9-el9

<<: &test_machine
  machine:
    baseImage: docker.apple.com/edge/trafficserver_autest:20261002-4-el9

timeout: 120

builds:
  - branchName: 10.2.x
    group: sync
    <<: *build_machine
    build:
      template: freestyle:v4:build
      steps:
        - git remote add asf https://github.com/apache/trafficserver.git || true
        - git fetch asf
        - 'git merge -m "Merge remote-tracking branch ''asf/10.2.x'' into 10.2.x" -m "($PIPELINE_SPEC_ID $RIO_BUILD_NUMBER)" --no-ff asf/10.2.x'
        - SSH_AUTH_SOCK=${SSH_AUTH_SOCK_TRAFFICSERVER} git push origin 10.2.x
    trigger:
      timer: "@weekly"
      gitPush: false
    finally:
      tag:
        enabled: false
      pipelineChain:
        - pipeline: release-10.2.x-publish-all
          upstreamGitRevision: false
    secrets:
      names:
        - TRAFFICSERVER
    jenkins:
      concurrentBuild: false

  - branchName: 10.2.x
    group: test
    version: unittest
    <<: *build_machine
    build:
      template: freestyle:v4:prb
      steps:
        - ./apple/rio.sh --build --branch 10.2.x --prb
    finally:
      notify:
        pullRequestComment:
          postOnSuccess: false
          postOnFailure: false
    jenkins:
      concurrentBuild: true

  - branchName: 10.2.x
    group: test
    version: autest
    <<: *test_machine
    build:
      template: freestyle:v4:prb
      steps:
        - ./apple/rio.sh --test --branch 10.2.x
    finally:
      notify:
        pullRequestComment:
          postOnSuccess: false
          postOnFailure: false
    reports:
      junit:
        paths:
          - "**/*.xml"
      logs:
        paths:
          - "_sandbox/**"
    jenkins:
      concurrentBuild: true

  - branchName: 10.2.x
    group: test
    version: autest
    <<: *test_machine
    build:
      template: freestyle:v4:publish
      buildParameters:
        - parameter: test_filter
          description: Tests to run
          defaultValue: "*"
      steps:
        - ./apple/rio.sh --test --branch 10.2.x -f "${BUILD_PARAM_test_filter}"
    reports:
      junit:
        paths:
          - "**/*.xml"
      logs:
        paths:
          - "_sandbox/**"
    trigger:
      gitPush: false
    finally:
      tag:
        enabled: false
    jenkins:
      concurrentBuild: true

  - branchName: 10.2.x
    group: hrw4u
    version: test
    <<: *build_machine
    build:
      template: freestyle:v4:publish
      steps:
        - (cd tools/hrw4u && make setup-deps && make test && make package)
    trigger:
      gitPush: false
    finally:
      tag:
        enabled: false

  - branchName: 10.2.x
    group: intpr
    <<: *build_machine
    build:
      template: freestyle:v4:publish
      buildParameters:
        - parameter: pr_id
          description: Internal GitHub PR ID to build
        - parameter: variation
          defaultValue: default
          description: Build variant to use
      steps:
        - ./apple/rio.sh --build --branch 10.2.x --prid ${BUILD_PARAM_pr_id} --variation ${BUILD_PARAM_variation}
    trigger:
      gitPush: false
    finally:
      tag:
        enabled: false
      notify:
        pullRequestComment:
          postOnSuccess: false
          postOnFailure: false
      pipelineChain:
        - project: ist-gns-edge-trafficserver-plugins
          pipeline: release-10.2.x-publish-10.x-el9
    package:
      freeform:
        - publish:
            - packageFilters: [rpm]
              repo: yum:cdn-edge
    jenkins:
      concurrentBuild: true

  - branchName: 10.2.x
    group: release
    version: regular
    <<: *build_machine
    build:
      template: freestyle:v4:publish
      buildParameters:
        - parameter: build_number
          description: DO NOT RUN PIPELINE. Build version will be created from running 'release-10.2.x-publish-all' pipeline
        - parameter: trigger_rats_h3_pipeline
          description: True to trigger the H3 release pipeline for RATS instead of normal ATS release
      steps:
        - ./apple/rio.sh --build --branch 10.2.x --tagbuild --release --hrw4u --number ${BUILD_PARAM_build_number}
    trigger:
      gitPush: false
    finally:
      tag:
        enabled: false
      pipelineChain:
        - project: ist-gns-edge-trafficserver-plugins
          pipeline: release-10.2.x-publish-10.x-el9
      notify:
        pullRequestComment:
          postOnSuccess: false
          postOnFailure: false
    secrets:
      names:
        - TRAFFICSERVER
    package:
      freeform:
        - optional: true
          publish:
            - packageFilters: [rpm]
              repo: yum:cdn-edge
            - packageFilters: [wheel]
              repo: apple-pypi-release-local
    jenkins:
      concurrentBuild: true

  - branchName: 10.2.x
    group: release
    version: variant
    <<: *build_machine
    build:
      template: freestyle:v4:publish
      buildParameters:
        - parameter: variation
          description: Build variant to use
        - parameter: build_number
          description: DO NOT RUN PIPELINE. Build version will be created from running 'release-10.2.x-publish-all' pipeline
      steps:
        - ./apple/rio.sh --build --branch 10.2.x --variation ${BUILD_PARAM_variation} --release --number ${BUILD_PARAM_build_number} --tagbuild
    trigger:
      gitPush: false
    finally:
      tag:
        enabled: false
      pipelineChain:
        - project: ist-gns-edge-trafficserver-plugins
          pipeline: release-10.2.x-publish-10.x-el9
      notify:
        pullRequestComment:
          postOnSuccess: false
          postOnFailure: false
    secrets:
      names:
        - TRAFFICSERVER
    package:
      freeform:
        - publish:
            - packageFilters: [rpm]
              repo: yum:cdn-edge
    jenkins:
      concurrentBuild: true

  ########
  # Breakfix
  ########
  - branchRules:
      includePatterns:
        - breakfix/.*
        - breakfix-.*
        - breakfix_.*
    group: breakfix
    <<: *build_machine
    build:
      template: freestyle:v4:publish
      buildParameters:
        - parameter: variation
          description: Build variation [boringssl (deault), asan, or debug]
        - parameter: version
          description: Build version for package name (i.e. 52.1234)
      steps:
        - ./apple/rio.sh --build --branch ${RIO_BRANCH_NAME} --breakfix ${BUILD_PARAM_version} --variation ${BUILD_PARAM_variation} --tagbuild
    trigger:
      gitPush: false
    finally:
      tag:
        enabled: false
    secrets:
      names:
        - TRAFFICSERVER
    package:
      freeform:
        - publish:
            - packageFilters: [rpm]
              repo: yum:cdn-edge
    jenkins:
      concurrentBuild: true

  ########
  # Multibuild release pipeline
  ########
  - branchName: 10.2.x
    group: release
    version: all
    <<: *build_machine
    build:
      template: freestyle:v4:publish
      buildParameters:
        - parameter: trigger_rats_h3_pipeline
          description: True to trigger the H3 release pipeline for RATS instead of normal ATS release
          defaultValue: "false"
      steps:
        - echo "There's nothing to do on this pipeline itself."
    trigger:
      gitPush: false
    finally:
      tag:
        enabled: false
      pipelineChain:
        - pipeline: release-10.2.x-publish-regular
          upstreamGitRevision: false
          buildArguments:
            - name: "build_number"
              value: ${RIO_BUILD_NUMBER}
            - name: "trigger_rats_h3_pipeline"
              value: ${BUILD_PARAM_trigger_rats_h3_pipeline}
        - pipeline: release-10.2.x-publish-variant
          upstreamGitRevision: false
          buildArguments:
            - name: "variation"
              value: "asan"
            - name: "build_number"
              value: ${RIO_BUILD_NUMBER}

  - branchName: 10.2.x
    group: intpr
    version: all
    <<: *build_machine
    build:
      template: freestyle:v4:publish
      buildParameters:
        - parameter: pr_id
          description: Internal GitHub PR ID to build
      steps:
        - echo "There's nothing to do on this pipeline itself."
    trigger:
      gitPush: false
    finally:
      tag:
        enabled: false
      pipelineChain:
        - pipeline: intpr-10.2.x-publish
          buildArguments:
            - name: "pr_id"
              value: ${BUILD_PARAM_pr_id}
        - pipeline: intpr-10.2.x-publish
          buildArguments:
            - name: "pr_id"
              value: ${BUILD_PARAM_pr_id}
            - name: "variation"
              value: "asan"

  - branchName: 10.2.x
    build:
      template: buildozer:v4:publish
      buildParameters:
        - parameter: ats_version
          description: The ats version to use
        - parameter: ats_release
          description: The ats release string (i.e. 202.12345)
    package:
      dockerfile:
        - dockerfilePath: apple/docker/Dockerfile
          version: "latest"
          extraTags: ["${BUILD_PARAM_ats_version}.${BUILD_PARAM_ats_release}"]
          env:
            ATS_VERSION: bazinga/${BUILD_PARAM_ats_version}/${BUILD_PARAM_ats_release}.el9
          perApplication: false
          publish:
            - repo: docker.apple.com/edge/trafficserver-dev
    trigger:
      gitPush: false
