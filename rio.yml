schemaVersion: '2.0'

<<: &build_machine
  machine:
    baseImage: docker.apple.com/edge/trafficserver_build:20230321-2-el7

<<: &test_machine
  machine:
    baseImage: docker.apple.com/edge/trafficserver_autest:20230814-2-el7

<<: &build_machine_el9
  machine:
    baseImage: docker.apple.com/edge/trafficserver_build:20230607-1-el9

<<: &test_machine_el9
  machine:
    baseImage: docker.apple.com/edge/trafficserver_autest:20230815-3-el9

timeout: 60

builds:
- branchName: master
  group: sync
  <<: *build_machine
  build:
    template: freestyle:v4:build
    steps:
    - git remote add asf https://github.com/apache/trafficserver.git || true
    - git fetch asf
    - 'git merge -m "Merge remote-tracking branch ''asf/master'' into master" -m "($PIPELINE_SPEC_ID $RIO_BUILD_NUMBER)" --no-ff asf/master'
    - SSH_AUTH_SOCK=${SSH_AUTH_SOCK_TRAFFICSERVER} git push origin master
  trigger:
    timer: '@weekly'
    gitPush: false
  finally:
    tag:
      enabled: false
  secrets:
    names:
    - TRAFFICSERVER
  jenkins:
    concurrentBuild: false

#########
# master - 10.x.x
#########

- branchName: master
  group: test
  version: unittest
  <<: *build_machine
  build:
    template: freestyle:v4:prb
    steps:
    - ./apple/rio.sh --build --branch master --variation -llvm --prb
  jenkins:
    concurrentBuild: true

- branchName: master
  group: intpr
  <<: *build_machine
  build:
    template: freestyle:v4:publish
    buildParameters:
    - parameter: pr_id
      description: Internal GitHub PR ID to build
    - parameter: variation
      defaultValue: boringssl
      description: Build variation [boringssl (default), llvm, asan, or debug]
    steps:
    - ./apple/rio.sh --build --branch master --prid ${BUILD_PARAM_pr_id} --variation -${BUILD_PARAM_variation}
  trigger:
    gitPush: false
  finally:
    tag:
      enabled: false
    pipelineChain:
      - project: ist-gns-edge-trafficserver-plugins
        pipeline: release-master-publish-10.x-el7
  package:
    freeform:
      - publish:
        - repo: yum:cdn-edge
  jenkins:
    concurrentBuild: true

- branchName: master
  group: intpr
  version: el9
  <<: *build_machine_el9
  build:
    template: freestyle:v4:publish
    buildParameters:
    - parameter: pr_id
      description: Internal GitHub PR ID to build
    - parameter: variation
      defaultValue: boringssl
      description: Build variation [boringssl (deault), llvm, asan, io_uring, or debug]
    steps:
    - ./apple/rio.sh --build --branch master --prid ${BUILD_PARAM_pr_id} --variation -${BUILD_PARAM_variation}
  trigger:
    gitPush: false
  finally:
    tag:
      enabled: false
  package:
    freeform:
      - publish:
        - repo: yum:cdn-edge
  jenkins:
    concurrentBuild: true

- branchName: master
  group: test
  version: autest
  <<: *test_machine
  build:
    template: freestyle:v4:prb
    steps:
    - ./apple/rio.sh --test --branch master --variation -boringssl
  finally:
    notify:
      pullRequestComment:
        postOnSuccess: false
        postOnFailure: false
  reports:
    junit:
      paths:
      - "**/.out/*.xml"
    logs:
      paths:
      - "_sandbox/**"
  jenkins:
    concurrentBuild: true

- branchName: master
  group: test
  version: autest-el9
  <<: *test_machine_el9
  build:
    template: freestyle:v4:prb
    steps:
    - ./apple/rio.sh --test --branch master --variation -boringssl
  finally:
    notify:
      pullRequestComment:
        postOnSuccess: false
        postOnFailure: false
  reports:
    junit:
      paths:
      - "**/.out/*.xml"
    logs:
      paths:
      - "_sandbox/**"
  jenkins:
    concurrentBuild: true

- branchName: master
  group: release
  version: regular
  <<: *build_machine
  build:
    template: freestyle:v4:publish
    steps:
    - ./apple/rio.sh --build --branch master --variation -boringssl --tagbuild
  trigger:
    gitPush: false
  finally:
    tag:
      enabled: false
    pipelineChain:
      - project: ist-gns-edge-trafficserver-plugins
        pipeline: release-master-publish-10.x-el7
  secrets:
    names:
    - TRAFFICSERVER
  package:
    freeform:
      - publish:
        - repo: yum:cdn-edge
  jenkins:
    concurrentBuild: true

- branchName: master
  group: release
  version: regular-el9
  <<: *build_machine_el9
  build:
    template: freestyle:v4:publish
    steps:
    - ./apple/rio.sh --build --branch master --variation -boringssl --tagbuild
  trigger:
    gitPush: false
  finally:
    tag:
      enabled: false
    pipelineChain:
      - project: ist-gns-edge-trafficserver-plugins
        pipeline: release-master-publish-10.x-el9
  secrets:
    names:
    - TRAFFICSERVER
  package:
    freeform:
      - publish:
        - repo: yum:cdn-edge
  jenkins:
    concurrentBuild: true

