schemaVersion: '2.0'

<<: &build_machine
  machine:
    baseImage: docker.apple.com/edge/trafficserver_build:20230321-2-el7

<<: &test_machine
  machine:
    baseImage: docker.apple.com/edge/trafficserver_autest:20230814-2-el7

<<: &build_machine_el9
  machine:
    baseImage: docker.apple.com/edge/trafficserver_build:20230607-1-el9

<<: &test_machine_el9
  machine:
    baseImage: docker.apple.com/edge/trafficserver_autest:20230815-3-el9

timeout: 60

builds:
- branchName: master
  group: sync
  <<: *build_machine
  build:
    template: freestyle:v4:build
    steps:
    - git remote add asf https://github.com/apache/trafficserver.git || true
    - git fetch asf
    - 'git merge -m "Merge remote-tracking branch ''asf/master'' into master" -m "($PIPELINE_SPEC_ID $RIO_BUILD_NUMBER)" --no-ff asf/master'
    - SSH_AUTH_SOCK=${SSH_AUTH_SOCK_TRAFFICSERVER} git push origin master
  trigger:
    timer: '@weekly'
    gitPush: false
  finally:
    tag:
      enabled: false
  secrets:
    names:
    - TRAFFICSERVER
  jenkins:
    concurrentBuild: false

#########
# master - 10.x.x
#########

- branchName: master
  group: test
  version: unittest
  <<: *build_machine_el9
  build:
    template: freestyle:v4:prb
    steps:
    - ./apple/rio.sh --build --branch master --prb
  jenkins:
    concurrentBuild: true

- branchName: master
  group: test
  version: autest
  <<: *test_machine_el9
  build:
    template: freestyle:v4:prb
    steps:
    - ./apple/rio.sh --test --branch master
  finally:
    notify:
      pullRequestComment:
        postOnSuccess: false
        postOnFailure: false
  reports:
    junit:
      paths:
      - "**/*.xml"
    logs:
      paths:
      - "_sandbox/**"
  jenkins:
    concurrentBuild: true

- branchName: master
  group: intpr
  <<: *build_machine_el9
  build:
    template: freestyle:v4:publish
    buildParameters:
    - parameter: pr_id
      description: Internal GitHub PR ID to build
    steps:
    - ./apple/rio.sh --build --branch master --prid ${BUILD_PARAM_pr_id}
  trigger:
    gitPush: false
  finally:
    tag:
      enabled: false
    pipelineChain:
      - project: ist-gns-edge-trafficserver-plugins
        pipeline: release-master-publish-10.x-el9
  package:
    freeform:
      - publish:
        - repo: yum:cdn-edge
  jenkins:
    concurrentBuild: true

- branchName: master
  group: release
  version: regular
  <<: *build_machine_el9
  build:
    template: freestyle:v4:publish
    steps:
    - ./apple/rio.sh --build --branch master --tagbuild
  trigger:
    gitPush: false
  finally:
    tag:
      enabled: false
    pipelineChain:
      - project: ist-gns-edge-trafficserver-plugins
        pipeline: release-master-publish-10.x-el9
  secrets:
    names:
    - TRAFFICSERVER
  package:
    freeform:
      - publish:
        - repo: yum:cdn-edge
  jenkins:
    concurrentBuild: true


########
# Breakfix
########
- branchRules:
    includePatterns:
      - breakfix/.*
      - breakfix-.*
      - breakfix_.*
  group: breakfix
  <<: *build_machine
  build:
    template: freestyle:v4:publish
    buildParameters:
    - parameter: variation
      defaultValue: boringssl
      description: Build variation [boringssl (deault), asan, or debug]
    - parameter: version
      description: Build version for package name (i.e. 52.1234)
    steps:
    - ./apple/rio.sh --build --branch ${RIO_BRANCH_NAME} --breakfix ${BUILD_PARAM_version} --variation -${BUILD_PARAM_variation} --tagbuild
  trigger:
    gitPush: false
  finally:
    tag:
      enabled: false
  secrets:
    names:
    - TRAFFICSERVER
  package:
    freeform:
      - publish:
        - repo: yum:cdn-edge
  jenkins:
    concurrentBuild: true
